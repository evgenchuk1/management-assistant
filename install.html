<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#203550">
<title>ניהול+ · התקנה · Install · Установка</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#203550;--navy3:#3a5d88;--deep:#142338;--gold:#CFAB6F;--gold2:#E8D3A6;--gold3:#A8864A;--cream:#F4F1EA;--card:#FFFDF8;--ink:#1B2A3E;--muted:#6E7787;--ios:#0A84FF;--and:#1A73E8}
body{font-family:'Heebo',-apple-system,'Segoe UI',Arial,sans-serif;background:var(--cream);color:var(--ink);-webkit-font-smoothing:antialiased}
header{background:linear-gradient(160deg,var(--navy3),var(--navy) 55%,var(--deep));color:#fff;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 18px;border-bottom:3px solid var(--gold);text-align:center}
header img{width:84px;height:84px;border-radius:20px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
header h1{font-size:28px;font-weight:900;margin-top:8px}
header p{color:var(--gold2);font-size:15px;margin-top:2px}
.langs{display:flex;gap:6px;justify-content:center;margin-top:12px}
.langs button{border:1.5px solid rgba(207,171,111,.6);background:transparent;color:#fff;border-radius:999px;padding:6px 14px;font:inherit;font-size:15px;font-weight:800;cursor:pointer}
.langs button.on{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--deep)}
main{max-width:620px;margin:0 auto;padding:16px}
.os{display:flex;gap:8px;margin-bottom:14px;position:sticky;top:0;z-index:5;background:var(--cream);padding:8px 0}
.os button{flex:1;border:2px solid var(--navy);background:#fff;color:var(--navy);border-radius:14px;padding:12px;font:inherit;font-size:17px;font-weight:900;cursor:pointer}
.os button.on{background:var(--navy);color:#fff}
.intro{background:var(--card);border:1px solid #EAE4D6;border-radius:16px;padding:14px;font-size:16px;line-height:1.6;margin-bottom:14px}
.intro b{color:var(--navy)}
.step{background:var(--card);border:1px solid #EAE4D6;border-radius:18px;padding:14px;margin-bottom:14px;box-shadow:0 2px 0 rgba(207,171,111,.35),0 6px 16px rgba(32,53,80,.07)}
.step h2{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900;color:var(--navy);margin-bottom:6px}
.step h2 .n{flex-shrink:0;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:18px}
.step p{font-size:16px;line-height:1.6;margin-bottom:10px}
.step p .k{display:inline-block;background:#EEF2F8;border:1px solid #DCE3EE;border-radius:8px;padding:0 6px;font-weight:800;white-space:nowrap}
.shot{display:flex;justify-content:center}
.shot svg{width:100%;max-width:300px;height:auto;filter:drop-shadow(0 8px 16px rgba(20,35,56,.25))}
.tip{font-size:14px;color:var(--muted);background:#FBF4E6;border:1px solid #EBDDBF;border-radius:12px;padding:8px 10px;margin-top:10px}
.qr{text-align:center;background:var(--card);border:1px solid #EAE4D6;border-radius:18px;padding:16px;margin:4px 0 14px}
.qr #qrc{display:inline-block;padding:10px;background:#fff;border-radius:12px;margin-top:8px}
.qr a{display:block;margin-top:8px;color:var(--navy);font-weight:800;word-break:break-all;direction:ltr}
.cta{display:block;text-align:center;text-decoration:none;margin:4px 0 18px;padding:14px;border-radius:16px;font-size:18px;font-weight:900;color:var(--deep);
  background:linear-gradient(170deg,#F3E3BE,var(--gold) 55%,#B8955A);box-shadow:0 5px 0 #8A6C3A}
footer{text-align:center;font-size:12px;color:var(--muted);padding:10px 16px 30px}
[dir=ltr] .step h2,[dir=ltr] .step p,[dir=ltr] .intro{text-align:left}
</style>
</head>
<body>
<header>
  <img src="icon-512.png" alt="ניהול+">
  <h1>ניהול+</h1>
  <p id="sub"></p>
  <div class="langs"><button data-l="he">עברית</button><button data-l="en">English</button><button data-l="ru">Русский</button></div>
</header>
<main>
  <div class="os"><button data-os="ios">🍎 iPhone</button><button data-os="and">🤖 Android</button></div>
  <div class="intro" id="intro"></div>
  <div id="steps"></div>
  <div class="qr"><b id="qrT"></b><br><div id="qrc"></div><a id="qrL" href="./">evgenchuk1.github.io/management-assistant</a></div>
  <a class="cta" id="cta" href="./"></a>
</main>
<footer>© 2026 ET studio · Evgeniy Tsipis — All rights reserved · כל הזכויות שמורות</footer>

/* ───── render ───── */
let lang=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q&&T[q])return q;const n=(navigator.language||'').slice(0,2);return T[n]?n:'he'})();
let os=/android/i.test(navigator.userAgent)?'and':'ios';
function render(){
  const t=T[lang];document.documentElement.lang=lang;document.documentElement.dir=t.dir;
  document.getElementById('sub').textContent=t.sub;document.getElementById('intro').innerHTML=t.intro;
  document.getElementById('qrT').textContent=t.qr;document.getElementById('cta').textContent=t.cta;
  document.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));
  document.querySelectorAll('[data-os]').forEach(b=>b.classList.toggle('on',b.dataset.os===os));
  document.getElementById('steps').innerHTML=t[os].map((s,i)=>`<div class="step"><h2><span class="n">${i+1}</span>${s[0]}</h2><p>${s[1]}</p><div class="shot">${shots[s[2]](t.L)}</div></div>`).join('')+
    `<div class="tip">💡 ${t.tip}</div>`;
}
document.addEventListener('click',e=>{const l=e.target.closest('[data-l]');if(l){lang=l.dataset.l;render()}const o=e.target.closest('[data-os]');if(o){os=o.dataset.os;render()}});
render();
try{new QRCode(document.getElementById('qrc'),{text:APP,width:170,height:170,colorDark:'#142338',colorLight:'#ffffff'})}catch(e){}
</script>
